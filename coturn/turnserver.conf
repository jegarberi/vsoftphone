# coturn as the softphone's TURN relay: Settings > Network > TURN, and
# "Always send media through the TURN relay" for networks that let no audio
# in directly (carrier-grade NAT).
#
# The user, password, realm and public address are not in this file:
# entrypoint.sh passes them, so no password is kept in the repository.
#
# To be of use against NAT the server has to run where both the softphone
# and the SIP server can reach it: a machine with a public address, with the
# ports below open.

# The softphone speaks TURN over UDP on this port
listening-port=3478

# The softphone logs in with a user and a password (long-term credentials)
lt-cred-mech
fingerprint

# One call takes four of these UDP ports (audio and its control channel, for
# each end that relays). Open the same range in the firewall.
min-port=49160
max-port=49200

# Nothing the softphone uses: TURN over TLS and DTLS, the admin console
no-tls
no-dtls
no-cli

# Limits for a server on the open internet
no-multicast-peers
user-quota=12
total-quota=100
stale-nonce=600

# On a public server, also stop the relay from being pointed at the
# server's own private network. Left off because it would block a SIP
# server on the same LAN, as with "make asterisk":
#denied-peer-ip=10.0.0.0-10.255.255.255
#denied-peer-ip=172.16.0.0-172.31.255.255
#denied-peer-ip=192.168.0.0-192.168.255.255

log-file=stdout
no-stdout-log
simple-log
